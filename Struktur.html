<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mein Notizbuch</title>
    <link rel="stylesheet" href="Style.css" />
  </head>

  <body>
    <div id="loginBereich" class="login-container">
      <div class="login-box">
        <h1>👋 Willkommen</h1>
        <p>Gib deinen Namen ein</p>
        <input id="name" placeholder="Dein Name" class="login-input" />
        <button onclick="einloggen()" class="login-btn">Einloggen</button>
      </div>
    </div>

    <div id="appBereich" style="display: none">
      <div class="container">
        <header class="header">
          <h1 id="begruessung">Meine To-do App ✅</h1>
          <div class="header-actions">
            <button onclick="ausloggen()" class="btn-logout">Ausloggen</button>
          </div>
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-text" id="fortschritt"
              >0 von 0 Aufgaben erledigt</span
            >
          </div>
        </header>

        <main class="main-content">
          <section class="filters">
            <button class="filter-btn active" onclick="filterSetzen('alle')">
              Alle
            </button>
            <button class="filter-btn" onclick="filterSetzen('offen')">
              Offen
            </button>
            <button class="filter-btn" onclick="filterSetzen('erledigt')">
              Erledigt
            </button>
          </section>

          <section class="add-task-section">
            <h2>Neue Aufgabe hinzufügen</h2>
            <div class="input-group">
              <input
                id="aufgabe"
                type="text"
                placeholder="Aufgabenbeschreibung..."
                class="task-input"
              />
              <div class="meta-inputs">
                <input
                  id="faelligDatum"
                  type="date"
                  class="meta-input date-input"
                />
                <select
                  id="prioritaetSelect"
                  class="meta-input priority-select"
                >
                  <option value="niedrig">Priorität: Niedrig</option>
                  <option value="mittel" selected>Priorität: Mittel</option>
                  <option value="hoch">Priorität: Hoch</option>
                </select>
              </div>
              <button onclick="aufgabeHinzufuegen()" class="btn-add">
                Hinzufügen
              </button>
            </div>
          </section>

          <section class="tasks-section">
            <ul id="liste" class="tasks-list"></ul>
          </section>
        </main>
      </div>
    </div>

    <!-- Bestätigungsdialog -->
    <div class="dialog-overlay" id="dialogOverlay"></div>
    <div class="dialog" id="confirmDialog">
      <h2>Aufgabe löschen?</h2>
      <p id="dialogMessage">
        Diese Aktion kann nicht rückgängig gemacht werden.
      </p>
      <div class="dialog-actions">
        <button class="btn-cancel" onclick="closeDialog()">Abbrechen</button>
        <button class="btn-delete" onclick="confirmDelete()">Löschen</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
